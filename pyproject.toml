[project]
name = "academic-ai"
version = "0.1.0"
description = "AI-powered academic document preparation system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.8",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "tenacity>=9.0",
    "keyring>=25.0",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "markdown>=3.6",
]

[project.optional-dependencies]
google = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]
rag = [
    "chromadb>=0.5",
]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-mock>=3.14",
    "pytest-cov>=5",
    "ruff>=0.7",
    "mypy>=1.11",
    "pyinstaller>=6.10",
    "types-pyyaml",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
